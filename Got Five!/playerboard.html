<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Marker Board</title>
  <style>
    :root { --ink: #572646; --paper: #fff8df; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: clamp(16px, 4vw, 44px); display: grid; place-items: center; background: #f5c45c radial-gradient(circle at 15% 8%, #fff0bb 0 5%, transparent 5.5%); font-family: "Trebuchet MS", system-ui, sans-serif; color: var(--ink); }
    .board { width: min(1100px, 100%); padding: clamp(16px, 3vw, 32px); background: var(--paper); border: 7px solid #8c4b2c; border-radius: 25px; box-shadow: 0 10px 0 #5d301d, 0 22px 34px #77421c77; }
    header { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; margin: 0 8px 20px; }
    h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 2.2rem); letter-spacing: .02em; }
    .tools { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: .88rem; }
    .tools button { width: 34px; height: 34px; cursor: pointer; color: var(--ink); background: #fffdf4; border: 2px solid #a56282; border-radius: 50%; font: 900 1.05rem system-ui; transition: transform .15s, background .15s; }
    .tools button:hover, .tools button.active { transform: translateY(-2px); background: #f2b8d3; border-color: #9b2864; }
    .tools .clear, .tools .fullscreen-btn { width: auto; padding: 0 10px; border-radius: 18px; font-size: .76rem; }
    body.simulated-fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; overflow: auto; padding: 10px; }
    body.simulated-fullscreen .board { width: 100%; height: 100%; overflow-y: auto; border-radius: 12px; }
    .rows { display: grid; gap: 9px; }
    .row { display: grid; grid-template-columns: 58px repeat(12, minmax(0, 1fr)); gap: 6px; }
    .label { display: grid; place-items: center; border-radius: 10px; font-weight: 900; color: #fffdf0; text-shadow: 0 2px #0005; }
    .tile { --c: #24a765; min-height: clamp(58px, 8.3vw, 78px); position: relative; display: grid; place-content: center; gap: 5px; padding: 5px 2px 3px; cursor: pointer; border: 3px solid color-mix(in srgb, var(--c), #56223a 32%); border-radius: 13px; background: var(--c); box-shadow: inset 0 3px #ffffff55, 0 3px #995c3c55; color: #fff8d7; font-size: clamp(1rem, 2.7vw, 1.75rem); font-weight: 900; line-height: 1; text-shadow: 0 2px #60273d; transition: transform .15s, filter .15s; }
    .tile:hover { transform: translateY(-3px); filter: brightness(1.07); }
    .marker { height: 17px; position: absolute; top: -13px; left: 50%; transform: translateX(-50%); display: grid; place-items: center; color: #000000; font: 900 1rem system-ui; text-shadow: 0 1px #572646; pointer-events: none; }
    .marker.circle { width: 24px; height: 24px; top: -14px; border: 3px solid #000000; border-radius: 50%; }
    .dots { display: flex; justify-content: center; gap: 3px; height: 7px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid #69344a; background: #fff4c5; }
    .green { --c: #27a864; } .pink { --c: #dd5f9d; } .blue { --c: #359bc5; } .red { --c: #e64c31; } .orange { --c: #f08d20; }
    .top-slots-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 auto 20px; background: #fffdf0; border: 3px solid #8c4b2c; border-radius: 16px; padding: 10px 20px; width: fit-content; }
    .top-slots-container span { font-weight: 900; font-size: 1.05rem; color: var(--ink); }
    .top-slots { display: flex; gap: 8px; }
    .top-slot { width: 44px; height: 44px; border: 3px solid #a56282; border-radius: 50%; background: #fff8df; color: var(--ink); font: 900 1.25rem "Trebuchet MS", sans-serif; text-align: center; outline: none; transition: border-color 0.15s, transform 0.15s, background-color 0.15s; }
    .top-slot:focus { border-color: #9b2864; background: #f2b8d3; transform: scale(1.08); }
    .note { margin: 16px 7px 0; text-align: center; font-size: .82rem; font-weight: 700; opacity: .7; }
    @media (max-width: 680px) { .board { border-width: 5px; padding: 16px 10px; } .row { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; } .label { grid-column: 1 / -1; min-height: 27px; } .tile { min-height: 54px; border-width: 2px; border-radius: 9px; } .dot { width: 5px; height: 5px; } .top-slots-container { padding: 8px 12px; gap: 8px; margin-bottom: 15px; } .top-slots-container span { font-size: 0.9rem; } .top-slot { width: 36px; height: 36px; font-size: 1.05rem; border-width: 2px; } }
  </style>
</head>
<body>
  <main class="board">
    <header>
      <h1>Number Marker Board</h1>
      <div class="tools" aria-label="Choose a marker">
        <span>Choose sign:</span>
        <button class="active" data-mark="circle" aria-label="Circle marker">○</button>
        <button data-mark="star" aria-label="Star marker">★</button>
        <button data-mark="check" aria-label="Check marker">✓</button>
        <button class="clear" id="clear">Clear all</button>
        <button class="fullscreen-btn" id="fullscreen" aria-label="Enter fullscreen mode">⛶ Fullscreen</button>
      </div>
    </header>
    <div class="top-slots-container">
      <span>My Numbers:</span>
      <div class="top-slots">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" class="top-slot" placeholder="" aria-label="Target number 1">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" class="top-slot" placeholder="" aria-label="Target number 2">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" class="top-slot" placeholder="" aria-label="Target number 3">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" class="top-slot" placeholder="" aria-label="Target number 4">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" class="top-slot" placeholder="" aria-label="Target number 5">
      </div>
    </div>
    <section class="rows" id="rows" aria-label="Numbers one through sixty"></section>
    <p class="note">The dots repeat by column: 1 dot, 2 dots, 3 dots — then back to 1.</p>
  </main>
  <script>
    const rows = document.querySelector('#rows');
    const colors = ['green', 'pink', 'blue', 'red', 'orange'];
    const labels = ['1', '2', '3', '4', '5'];
    let selected = 'circle';
    colors.forEach((color, row) => {
      const line = document.createElement('div'); line.className = 'row';
      const label = document.createElement('div'); label.className = `label ${color}`; label.textContent = labels[row]; line.append(label);
      for (let column = 0; column < 12; column++) {
        const number = row + 1 + column * 5;
        const dotCount = column % 3 + 1;
        const tile = document.createElement('button'); tile.className = `tile ${color}`; tile.type = 'button';
        tile.dataset.number = number; tile.setAttribute('aria-label', `Number ${number}, ${dotCount} dots`);
        tile.innerHTML = `<span class="marker" aria-hidden="true"></span><span>${number}</span><span class="dots">${'<i class="dot"></i>'.repeat(dotCount)}</span>`;
        tile.addEventListener('click', () => {
          const mark = tile.querySelector('.marker');
          if (tile.dataset.mark === selected) { mark.textContent = ''; mark.className = 'marker'; delete tile.dataset.mark; }
          else { tile.dataset.mark = selected; mark.className = `marker ${selected}`; mark.textContent = selected === 'star' ? '★' : selected === 'check' ? '✓' : ''; }
        });
        line.append(tile);
      }
      rows.append(line);
    });
    document.querySelectorAll('[data-mark]').forEach(button => button.addEventListener('click', () => {
      selected = button.dataset.mark;
      document.querySelectorAll('[data-mark]').forEach(item => item.classList.toggle('active', item === button));
    }));
    document.querySelector('#clear').addEventListener('click', () => {
      document.querySelectorAll('.tile[data-mark]').forEach(tile => {
        delete tile.dataset.mark; const mark = tile.querySelector('.marker'); mark.className = 'marker'; mark.textContent = '';
      });
      document.querySelectorAll('.top-slot').forEach(slot => {
        slot.value = '';
      });
    });

    const fullscreenBtn = document.querySelector('#fullscreen');
    
    function lockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(err => {
          console.warn('Orientation lock failed:', err);
        });
      }
    }

    function unlockOrientation() {
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }

    function toggleFullscreen() {
      const docEl = document.documentElement;
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      if (!isFullscreen) {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        } else if (docEl.msRequestFullscreen) {
          docEl.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }

    function updateFullscreenUI() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      if (isFullscreen) {
        fullscreenBtn.innerHTML = 'Collapse';
        fullscreenBtn.setAttribute('aria-label', 'Exit fullscreen mode');
        document.body.classList.add('fullscreen-active');
        lockLandscape();
      } else {
        fullscreenBtn.innerHTML = '⛶ Fullscreen';
        fullscreenBtn.setAttribute('aria-label', 'Enter fullscreen mode');
        document.body.classList.remove('fullscreen-active');
        unlockOrientation();
      }
    }

    if (fullscreenBtn) {
      const isFullscreenSupported = document.fullscreenEnabled || document.webkitFullscreenEnabled || document.mozFullScreenEnabled || document.msFullscreenEnabled;
      if (isFullscreenSupported) {
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
          document.addEventListener(evt, updateFullscreenUI);
        });
      } else {
        fullscreenBtn.addEventListener('click', () => {
          document.body.classList.toggle('simulated-fullscreen');
          const isSimulated = document.body.classList.contains('simulated-fullscreen');
          if (isSimulated) {
            fullscreenBtn.innerHTML = 'Collapse';
            fullscreenBtn.setAttribute('aria-label', 'Exit simulated fullscreen mode');
            lockLandscape();
          } else {
            fullscreenBtn.innerHTML = '⛶ Fullscreen';
            fullscreenBtn.setAttribute('aria-label', 'Enter simulated fullscreen mode');
            unlockOrientation();
          }
        });
      }
    }
  </script>
</body>
</html>
